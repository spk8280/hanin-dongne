<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한인 동네</title>
<meta name="theme-color" content="#E8613C">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#FBF7F2;--card:#fff;--ink:#1F1A17;--muted:#7A6F68;--line:#EDE5DC;--brand:#E8613C;--brand-soft:#FDE9E1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--card:#221E1B;--ink:#F4EEE8;--muted:#A89D95;--line:#332D29;--brand:#F07A55;--brand-soft:#3A2620}}
:root[data-theme="dark"]{--bg:#171412;--card:#221E1B;--ink:#F4EEE8;--muted:#A89D95;--line:#332D29;--brand:#F07A55;--brand-soft:#3A2620}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea{min-height:110px;resize:vertical}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;max-width:560px;margin:0 auto}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}
.logo span{color:var(--brand)}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tab{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-weight:500;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.post{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.thumb{width:92px;height:92px;border-radius:12px;background:var(--brand-soft);flex:none;object-fit:cover;display:grid;place-items:center;font-size:30px}
.post h3{font-size:16px;font-weight:500;line-height:1.35;word-break:break-word}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.price{font-weight:700;margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--brand-soft);color:var(--brand);font-weight:700;margin-right:4px}
.badge.gray{background:var(--line);color:var(--muted)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:24px;background:var(--brand);color:#fff;font-weight:700;padding:14px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(232,97,60,.35);z-index:6}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;text-align:center}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
label{display:block;font-weight:500;font-size:13.5px;margin:16px 0 6px}
.row{display:flex;gap:8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px 32px}
.panel h2{font-size:19px;font-weight:700}
.close{float:right;font-size:22px;color:var(--muted);line-height:1}
.photo-pick{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.photo-pick img{max-width:100%;max-height:220px;border-radius:10px}
.detail-img{width:100%;border-radius:14px;margin:12px 0;max-height:360px;object-fit:cover;background:var(--brand-soft)}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.join{padding-top:12vh}
.join .logo{font-size:34px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
.small{font-size:12.5px;color:var(--muted)}
.links{display:flex;gap:14px;margin-top:18px;justify-content:center}
.links button{color:var(--muted);font-size:13px;text-decoration:underline}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="app"><div class="empty">불러오는 중...</div></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
const SUPABASE_URL = 'https://oroygikugqzuxcinamwp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WW_d2tooXsiuMsiVz4mqDg_5Yb0_btO';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATS = {sale:{n:'중고거래',e:'🛍️'},free:{n:'나눔',e:'🎁'},help:{n:'품앗이',e:'🤝'},info:{n:'생활정보',e:'📌'}};
const STATUS = {active:'',reserved:'예약중',done:'거래완료'};
let me = null, zones = [], filter = 'all', posts = [];

const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return'방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';return Math.floor(s/86400)+'일 전'}
function money(p){return p==null?'':(p===0?'무료':'$'+Number(p).toLocaleString())}
function priceText(p){return p.category==='free'?'무료':(p.category==='sale'?money(p.price):'')}
function openSheet(html){$('#panel').innerHTML=html;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    const {data} = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(data){me=data;return home();}
  }
  joinScreen();
}

function joinScreen(){
  const pre = new URLSearchParams(location.search).get('code')||'';
  $('#app').innerHTML=`<div class="wrap join">
    <div class="logo">한인<span>동네</span></div>
    <p class="sub" style="margin-top:6px">애틀랜타 한인 이웃끼리 사고팔고, 나누고, 돕는 곳</p>
    <label>초대코드</label><input id="code" value="${esc(pre)}" placeholder="받은 초대코드를 입력하세요" autocapitalize="characters">
    <label>닉네임</label><input id="nick" placeholder="2~20자" maxlength="20">
    <label>사는 동네 (선택)</label><input id="area" placeholder="예: 둘루스, 스와니, 뷰포드">
    <div style="height:20px"></div>
    <button class="btn" id="joinBtn">시작하기</button>
    <p class="small" style="margin-top:14px;text-align:center">회원가입 없이 이 기기에서 바로 쓸 수 있어요.<br>다른 기기나 브라우저에서는 초대코드를 다시 입력해야 해요.</p>
  </div>`;
  $('#joinBtn').onclick=async()=>{
    const code=$('#code').value.trim(), nick=$('#nick').value.trim(), area=$('#area').value.trim();
    if(!code||nick.length<2)return toast('초대코드와 닉네임(2자 이상)을 입력해 주세요');
    const b=$('#joinBtn');b.disabled=true;b.textContent='확인 중...';
    const reset=()=>{b.disabled=false;b.textContent='시작하기'};
    let {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error){reset();return toast('접속 오류: '+r.error.message)}}
    const {error}=await sb.rpc('join_with_invite',{p_code:code,p_nickname:nick,p_area:area||null});
    if(error){reset();return toast(error.message.includes('invalid')?'초대코드가 맞지 않거나 사용 횟수가 끝났어요':'오류: '+error.message)}
    boot();
  };
}

async function home(){
  $('#app').innerHTML=`<header>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="logo">한인<span>동네</span></div><div class="sub">${esc(me.nickname)}님${me.area?' · '+esc(me.area):''}</div></div>
        <button class="tab" id="mineBtn">내 글</button>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab" data-f="all">전체</button>
        ${Object.entries(CATS).map(([k,v])=>`<button class="tab" data-f="${k}">${v.e} ${v.n}</button>`).join('')}
      </div>
    </header>
    <div class="wrap"><div id="list"><div class="empty">불러오는 중...</div></div></div>
    <button class="fab" id="fab">＋ 글쓰기</button>`;
  $('#tabs').onclick=e=>{const f=e.target.closest('[data-f]');if(!f)return;filter=f.dataset.f;renderList()};
  $('#fab').onclick=writeSheet;
  $('#mineBtn').onclick=()=>{filter=filter==='mine'?'all':'mine';renderList()};
  if(!zones.length){const {data}=await sb.from('safe_zones').select('*').order('id');zones=data||[]}
  await loadPosts();
}

async function loadPosts(){
  const {data,error}=await sb.from('posts').select('*, profiles(nickname)').order('created_at',{ascending:false}).limit(200);
  if(error)return toast('불러오기 오류: '+error.message);
  posts=data;renderList();
}

function renderList(){
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.f===filter));
  $('#mineBtn').classList.toggle('on',filter==='mine');
  const list=posts.filter(p=>filter==='all'||(filter==='mine'?p.user_id===me.id:p.category===filter));
  $('#list').innerHTML=list.length?list.map(p=>`<div class="post" data-id="${p.id}">
      ${p.image_url?`<img class="thumb" src="${esc(p.image_url)}" loading="lazy" alt="">`:`<div class="thumb">${CATS[p.category].e}</div>`}
      <div style="min-width:0">
        <h3>${esc(p.title)}</h3>
        <div class="meta">${CATS[p.category].n}${p.area?' · '+esc(p.area):''} · ${ago(p.created_at)}</div>
        <div class="price">${STATUS[p.status]?`<span class="badge gray">${STATUS[p.status]}</span>`:''}${priceText(p)}</div>
      </div></div>`).join(''):`<div class="empty">아직 글이 없어요.<br>첫 글을 올려보세요!</div>`;
  document.querySelectorAll('.post').forEach(el=>el.onclick=()=>detail(el.dataset.id));
}

function detail(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  const mine=p.user_id===me.id, zone=zones.find(z=>z.id===p.safe_zone_id);
  let contact='';
  if(!mine&&p.contact_value){
    contact=p.contact_type==='kakao'
      ?`<a class="btn" href="${esc(p.contact_value)}" target="_blank" rel="noopener">카카오톡 오픈채팅으로 연락</a>`
      :`<a class="btn" href="sms:${esc(p.contact_value.replace(/[^0-9+]/g,''))}">문자로 연락하기</a>`;
  }
  openSheet(`<button class="close" onclick="closeSheet()">✕</button>
    <span class="badge">${CATS[p.category].n}</span>${STATUS[p.status]?`<span class="badge gray">${STATUS[p.status]}</span>`:''}
    <h2 style="margin-top:8px">${esc(p.title)}</h2>
    <div class="meta">${esc(p.profiles?.nickname||'')}${p.area?' · '+esc(p.area):''} · ${ago(p.created_at)}</div>
    ${p.image_url?`<img class="detail-img" src="${esc(p.image_url)}" alt="">`:''}
    <div class="price" style="font-size:20px">${priceText(p)}</div>
    <p style="white-space:pre-wrap;margin:12px 0">${esc(p.description||'')}</p>
    ${zone?`<p class="small">🛡️ 안전 거래 장소: ${esc(zone.name)}</p>`:''}
    <div style="height:16px"></div>
    ${contact}
    ${mine?`<label>거래 상태</label><div class="seg" id="seg">${Object.entries({active:'진행중',reserved:'예약중',done:'완료'}).map(([k,v])=>`<button data-s="${k}" class="${p.status===k?'on':''}">${v}</button>`).join('')}</div>
      <div style="height:12px"></div><button class="btn ghost" id="delBtn">글 삭제</button>`
     :`<div style="height:10px"></div><button class="btn ghost" id="reviewBtn">거래 후기 보기·남기기</button>
      <div class="links"><button id="reportBtn">신고하기</button><button id="blockBtn">이 사람 차단</button></div>`}`);
  if(mine){
    $('#seg').onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;
      const {error}=await sb.from('posts').update({status:b.dataset.s}).eq('id',p.id);
      if(error)return toast(error.message);p.status=b.dataset.s;renderList();detail(p.id)};
    $('#delBtn').onclick=async()=>{if(!confirm('이 글을 삭제할까요? 되돌릴 수 없어요.'))return;
      const {error}=await sb.from('posts').delete().eq('id',p.id);if(error)return toast(error.message);
      posts=posts.filter(x=>x.id!==p.id);closeSheet();renderList();toast('삭제했어요')};
  }else{
    $('#reportBtn').onclick=async()=>{const r=prompt('신고 사유를 적어주세요 (예: 사기 의심, 부적절한 글)');if(!r)return;
      const {error}=await sb.from('reports').insert({post_id:p.id,reason:r});toast(error?error.message:'신고가 접수됐어요')};
    $('#blockBtn').onclick=async()=>{if(!confirm('이 사람의 글이 더 이상 보이지 않게 할까요?'))return;
      const {error}=await sb.from('blocks').insert({blocked_id:p.user_id});if(error)return toast(error.message);
      closeSheet();await loadPosts();toast('차단했어요')};
    $('#reviewBtn').onclick=()=>reviewSheet(p);
  }
}

async function reviewSheet(p){
  const {data}=await sb.from('reviews').select('rating,comment,created_at').eq('target_id',p.user_id).order('created_at',{ascending:false});
  const avg=data?.length?(data.reduce((a,r)=>a+r.rating,0)/data.length).toFixed(1):null;
  openSheet(`<button class="close" onclick="closeSheet()">✕</button>
    <h2>${esc(p.profiles?.nickname||'')}님 후기</h2>
    <p class="meta">${avg?`⭐ ${avg} · 후기 ${data.length}개`:'아직 받은 후기가 없어요'}</p>
    ${(data||[]).slice(0,5).map(r=>`<p style="margin-top:8px">${'⭐'.repeat(r.rating)} <span class="small">${ago(r.created_at)}</span><br>${esc(r.comment||'')}</p>`).join('')}
    <label>별점</label><div class="seg" id="stars">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${n===5?'on':''}">${n}</button>`).join('')}</div>
    <label>한 줄 후기</label><input id="rc" placeholder="예: 시간 약속 잘 지키셨어요">
    <div style="height:16px"></div><button class="btn" id="rsave">후기 남기기</button>`);
  let n=5;$('#stars').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;n=+b.dataset.n;document.querySelectorAll('#stars button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#rsave').onclick=async()=>{const {error}=await sb.from('reviews').insert({post_id:p.id,target_id:p.user_id,rating:n,comment:$('#rc').value.trim()||null});
    if(error)return toast(error.message);closeSheet();toast('후기를 남겼어요')};
}

function writeSheet(){
  let file=null, cat='sale';
  openSheet(`<button class="close" onclick="closeSheet()">✕</button><h2>글쓰기</h2>
    <label>사진</label>
    <div class="photo-pick" id="pick">📷 사진 한 장 선택하기</div>
    <input type="file" accept="image/*" id="file" hidden>
    <p class="small" style="margin-top:6px">✨ 사진으로 제목·설명·가격 자동 작성은 곧 추가돼요</p>
    <label>종류</label>
    <div class="seg" id="cat">${Object.entries(CATS).map(([k,v],i)=>`<button data-c="${k}" class="${i===0?'on':''}">${v.n}</button>`).join('')}</div>
    <label>제목</label><input id="t" maxlength="80" placeholder="예: 아기 카시트 팝니다">
    <div id="priceBox"><label>가격 ($)</label><input id="pr" type="number" min="0" inputmode="numeric" placeholder="예: 40"></div>
    <label>설명</label><textarea id="d" placeholder="상태, 사용 기간, 거래 가능한 시간 등"></textarea>
    <label>동네</label><input id="ar" value="${esc(me.area||'')}" placeholder="예: 둘루스">
    <label>안전 거래 장소 (선택)</label>
    <select id="z"><option value="">선택 안 함</option>${zones.map(z=>`<option value="${z.id}">${esc(z.name)}</option>`).join('')}</select>
    <label>연락 방법</label>
    <div class="row"><select id="ct" style="flex:0 0 40%"><option value="sms">문자</option><option value="kakao">카톡 오픈채팅</option></select>
    <input id="cv" placeholder="전화번호"></div>
    <div style="height:20px"></div><button class="btn" id="save">올리기</button>`);
  $('#pick').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{file=e.target.files[0];if(!file)return;$('#pick').innerHTML=`<img src="${URL.createObjectURL(file)}" alt="">`};
  $('#cat').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;
    document.querySelectorAll('#cat button').forEach(x=>x.classList.toggle('on',x===b));$('#priceBox').style.display=cat==='sale'?'':'none'};
  $('#ct').onchange=()=>$('#cv').placeholder=$('#ct').value==='kakao'?'https://open.kakao.com/o/...':'전화번호';
  $('#save').onclick=async()=>{
    const title=$('#t').value.trim();if(!title)return toast('제목을 입력해 주세요');
    const ct=$('#ct').value, cv=$('#cv').value.trim();
    if(ct==='kakao'&&cv&&!/^https:\/\/open\.kakao\.com\//.test(cv))return toast('오픈채팅 링크는 https://open.kakao.com/ 으로 시작해야 해요');
    const b=$('#save');b.disabled=true;b.textContent='올리는 중...';
    const reset=()=>{b.disabled=false;b.textContent='올리기'};
    let image_url=null;
    if(file){
      const blob=await shrink(file);
      const path=`${me.id}/${Date.now()}.jpg`;
      const up=await sb.storage.from('post-images').upload(path,blob,{contentType:'image/jpeg'});
      if(up.error){reset();return toast('사진 업로드 오류: '+up.error.message)}
      image_url=sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
    }
    const row={category:cat,title,description:$('#d').value.trim()||null,area:$('#ar').value.trim()||null,
      price:cat==='sale'&&$('#pr').value!==''?parseInt($('#pr').value):null,
      safe_zone_id:$('#z').value?+$('#z').value:null,contact_type:cv?ct:null,contact_value:cv||null,image_url};
    const {error}=await sb.from('posts').insert(row);
    if(error){reset();return toast('오류: '+error.message)}
    closeSheet();filter='all';await loadPosts();toast('글을 올렸어요');
  };
}

// 사진을 1280px 이하 JPEG로 줄여서 저장 용량 절약
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{
  const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>res(b||file),'image/jpeg',0.82)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}

boot().catch(e=>{$('#app').innerHTML=`<div class="empty">연결 오류가 났어요. 잠시 후 새로고침해 주세요.<br><span class="small">${esc(e.message)}</span></div>`});
</script>
</body>
</html>
